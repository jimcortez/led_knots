output_bounds: 
  width: 1000 #mm
  length: 1000 #mm
  height: 1000 #mm

  #saturn 4 Ultra 16k
  # width: 200
  # length: 108
  # height: 210

tube_settings:
  #outer_diameter: 30 #mm
  auto_diameter: true #if true, use the led strip led count to calculate best diffusion distance
  wall_thickness: 1.0 #mm
  oval_wall_thickness: 0.5 #mm
  connector_width: 0.5 #mm
  double_sided_led: true
  led_tolerance_width: 1.0 #mm extra space for led to fit in
  led_tolerance_height: 1.0 #mm extra space for led to fit in
  diffusion_ridges:
    ridge_height: 2.5 #mm
    ridge_width: 2.0 #mm
    ridge_spacing: 1 #mm

led_strip_settings:
  #BTF ws2815
  width: 10 #mm
  height: 1.8 #mm
  led_count: 60 #number of leds per meter
  min_90_degtree_twist_distance: 70 #mm minimum distance for 90 degree twist

server:
  object_cache: 'cache/glb_blobs'
  # Optional yacv_server env overrides (snake_case → YACV_* env vars)
  # protocol: 'http'  # or 'stderr'
  # texture: 'file:/path/to/image.png'
  # color_faces: '#ffbf00'
  # color_edges: '#1a1aff'
  # color_vertices: '#1a1a1a'
  # graceful_secs_connect: 12.0
  # graceful_secs_work: 1000000
  # host: 'localhost'
  # port: 32323
  # disable_server: false

export:
  tolerance: 0.00005 # Tolerance for export (STL, STEP, 3MF)
  angular_tolerance: 0.05 # Angular tolerance for export (radians) (STL, STEP, 3MF)
