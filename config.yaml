# =============================================================================
# LED Knots – config.yaml
# =============================================================================

# -----------------------------------------------------------------------------
# Output bounds: bounding box for knot path scaling
# -----------------------------------------------------------------------------
output_bounds:
  # width: 400    # mm
  # length: 400   # mm
  # height: 350     # mm

  # Elegoo Saturn 4 Ultra 16k build volume
  width: 200    # mm
  length: 110   # mm
  height: 200     # mm

# Active cross-section face: led_circle | led_circle_diffusion_pyramids |
# led_circle_tube | solid_circle | solid_circle_pyramid | square
face_type: led_circle_tube

# -----------------------------------------------------------------------------
# Face-specific settings (keyed by face type)
# Use inherit_from to inherit from another face and override keys.
# -----------------------------------------------------------------------------
face_settings:

  led_circle:
    outer_diameter: 30      # mm – tube outer diameter
    wall_thickness: 4.0     # mm – outer ring wall thickness
    rect_inner_x: 4.6       # mm – inner cavity X (e.g. strip height×2 + tolerance)
    rect_inner_y: 11.0      # mm – inner cavity Y (e.g. strip width + tolerance)
    oval_wall_thickness: 0.5   # mm – wall around oval cavity
    connector_width: 0.5       # mm – width of connectors to center oval
    diffusion_ridges: false

  led_circle_with_ridges:
    outer_diameter: 30      # mm – tube outer diameter
    wall_thickness: 1.0     # mm – outer ring wall thickness
    rect_inner_x: 4.6       # mm – inner cavity X (e.g. strip height×2 + tolerance)
    rect_inner_y: 11.0      # mm – inner cavity Y (e.g. strip width + tolerance)
    oval_wall_thickness: 0.5   # mm – wall around oval cavity
    connector_width: 0.5       # mm – width of connectors to center oval
    diffusion_ridges:
      ridge_height: 2.5    # mm
      ridge_width: 2.0     # mm – horizontal size
      ridge_spacing: 1      # mm
      ridge_depth: 2.5     # mm – peak height of pyramid along path

  led_circle_tube:
    outer_diameter: 30              # mm – tube outer diameter
    wall_thickness: 4.0             # mm – outer ring wall thickness
    inner_tube_diameter: 10         # mm – ID of the central circular tube
    inner_tube_wall_thickness: 0.5  # mm – wall around the central tube
    connector_width: 0.5            # mm – width of connectors to center tube

  led_circle_diffusion_pyramids:
    inherit_from: led_circle
    diffusion_ridges:
      ridge_height: 3.0    # mm – override; pyramids use this along path
      ridge_width: 2.0     # mm
      ridge_spacing: 1     # mm
      ridge_depth: 2.5    # mm

  solid_circle:
    inherit_from: led_circle
    outer_diameter: 30      # mm – tube outer diameter

  solid_circle_pyramid:
    inherit_from: solid_circle
    wall_thickness: 1.0    # mm
    diffusion_ridges:
      ridge_width: 2.0     # mm
      ridge_spacing: 1     # mm
      ridge_depth: 2.5     # mm

  square:
    outer_width: 30        # mm – side length of square

# -----------------------------------------------------------------------------
# Path / twist limits
# -----------------------------------------------------------------------------
path:
  min_90_degree_twist_distance: 1   # mm – minimum path length for 90° twist

# -----------------------------------------------------------------------------
# Print segmentation (optional): split oversized knots into printable segments
# -----------------------------------------------------------------------------
max_print_bounds:
  enabled: false

  # Elegoo Saturn 4 Ultra 16k build volume
  width: 200    # mm
  length: 110   # mm
  height: 200     # mm

  clearance_mm: 2.0         # mm – subtract from all sides
  max_segments: 32          # safety cap for segmentation
  layout: path              # path | print_bed — path keeps segments on the sweep; print_bed lays parts on the build plate
  layout_gap_mm: 2      # mm – print_bed: gap along build-plate row (X); path: axial clearance at each internal joint (±half along path tangent)

  path_samples: 1001        # Wire samples used by segmentation DP
  joint:
    enabled: true
    style: twin_pin         # twin_pin | dovetail
    clearance_mm: 0.2       # mm
    close_loop: false       # add final join for closed loop paths
    pin_diameter_mm: 3.0    # mm
    pin_depth_mm: 4.0       # mm
    pin_radial_offset_mm: 17.0 # mm (centerline to pin axis; clamped to tube OD if too large)
    pin_spacing_mm: 7.0     # mm (distance between pin centers)
    lap_overlap_mm: 4.0     # mm – axial overlap at each internal cut (both neighbors extend)
    lap_step_height_mm: 3.0 # mm – radial rabbet step on the outer wall at each lap
    neck_width_mm: 3.0      # mm (dovetail)
    base_width_mm: 5.0      # mm (dovetail)
    depth_mm: 4.0           # mm (dovetail/pocket depth)
    flank_angle_deg: 12.0   # deg (dovetail)

# -----------------------------------------------------------------------------
# Tube gap (open segment) + clamp settings
# -----------------------------------------------------------------------------
tube_gap:
  enabled: false
  gap_length_mm: 25.0        # mm – arc-length gap in the sweep path
  center_fraction: 0.0       # [-0.5, 0.5] – 0.0 centered along the path

clamp:
  enabled: true
  clearance_diameter_mm: 0.5  # mm – clamp ID = tube OD + clearance
  length_mm: 18.0             # mm – axial length of the clamp
  wall_thickness_mm: 1.25      # mm – clamp wall thickness outside the tube
  wire_hole_diameter_mm: 4.0  # mm – through-hole for wires on one half
  wire_ring_height_mm: 4.0    # mm – ring height above surface
  wire_ring_top_thickness_mm: 1.0   # mm – ring wall thickness at the top
  wire_ring_base_thickness_mm: 2.0  # mm – ring wall thickness at the base (tapers up)

  lap_depth_mm: 1.0           # mm – how far lap joint steps into wall
  lap_step_height_mm: 1.5     # mm – radial step height for the seam rabbet
  lap_clearance_mm: 0.2       # mm – extra clearance so halves assemble easily
  adhesive_gap_mm: 0.10       # mm – explicit glue line thickness
  reg_lip_height_mm: 0.8      # mm – tongue height (radial)
  reg_lip_width_mm: 1.2       # mm – tongue width (across seam normal)
  reg_clearance_mm: 0.08      # mm – clearance between tongue and groove (resin-friendly)
  relief_enabled: true
  relief_depth_mm: 0.3        # mm – escape pocket depth (radial)
  relief_width_mm: 0.5        # mm – escape pocket width (across seam normal)
  alignment_notch_enabled: true
  alignment_notch_width_mm: 3.0   # mm – length along Z (axial)
  alignment_notch_depth_mm: 0.8   # mm – protrusion into mating half (Y)
  alignment_notch_clearance_mm: 0.1  # mm – clearance for easy assembly

# -----------------------------------------------------------------------------
# Print optimization (SLA / resin print prep)
# -----------------------------------------------------------------------------
# Detects overhangs/islands/cavities and (with auto_apply) re-orients the part
# to minimise support material. Defaults disabled so existing flows are
# unchanged. Override with --optimize / --auto-orient on the CLI.
print_optimization:
  enabled: false
  target: sla                  # sla | fdm  (PR1 wires up sla only)
  overhang_threshold_deg: 35   # SLA: ~35°; FDM: ~45° (reserved for future)
  orientation:
    enabled: true
    auto_apply: false          # require --auto-orient to mutate geometry
    top_n_candidates: 5
    # Multiplicative bonus when a candidate orientation stands the LED-tube
    # connectors vertically (so they act as natural support columns).
    # 0 disables; 0.7 means a fully-vertical-connectors orientation cuts
    # Tweaker-3's unprintability score by 70%, usually enough to flip the
    # default volume-minimising pick to the connectors-as-supports pose.
    connector_bonus_weight: 0.7
  drain_holes:
    # Auto-drill drain (bottom) + vent (top) holes through trapped resin
    # cavities detected by the analyzer. Requires --auto-orient AND the
    # cavity detector to be available (manifold3d installed). Disabled by
    # default — opt in only after the analyzer's cavity report on your
    # part looks correct.
    enabled: false
    diameter_mm: 1.5
    min_cavity_volume_mm3: 100.0
    margin_mm: 5.0             # how far the drill cylinder extends past the part Z-extents

# -----------------------------------------------------------------------------
# Server (cadquery-web-viewer)
# -----------------------------------------------------------------------------
server:
  # Optional styling / protocol (see cadquery-web-viewer docs → CADQUERY_WEB_VIEWER_*):
  # protocol: HTTP
  # texture: "data:image/png;base64,..."
  # color_faces: "#ffbf00"
  # color_edges: "#1a1aff"
  # color_vertices: "#1a1a1a"
  viewer:
    mode: remote
    # off | embedded | remote — remote: POST to a running `cadquery-web-viewer` server
    embedded:
      host: 127.0.0.1
      port: 32323
      open_browser: true
      wait_for_first_client: false
      block_until_disconnect: false
    remote:
      host: localhost
      port: 32323

# -----------------------------------------------------------------------------
# Export (3D file output)
# -----------------------------------------------------------------------------
export:
  tolerance: 0.0001         # linear tolerance
  angular_tolerance: 0.05   # rad
  stl_ascii: true           # true = ASCII STL, false = binary

# -----------------------------------------------------------------------------
# Mesh export (simulation-focused OBJ output)
# -----------------------------------------------------------------------------
mesh:
  # Optional unit scaling for mesh export. If true, convert dimensions
  # from millimeters (CadQuery default) to meters
  unit_scale_mm_to_m: true

  # Optional maximum triangle count for mesh decimation. If null or
  # omitted, no automatic decimation is applied. When set, trimesh will
  # attempt to simplify the mesh to approximately this many faces.
  target_face_count: null

  # Require watertight (closed) meshes for export. If true and the
  # generated mesh is not watertight, mesh export will fail with a
  # clear error instead of writing a partial mesh.
  watertight_required: false

# -----------------------------------------------------------------------------
# Preview (mesh → image; finer tessellation for smooth tube appearance)
# -----------------------------------------------------------------------------
preview:
  stl_cache: cache/preview   # directory path
  # Tessellation for preview mesh (smaller = smoother; used when generating preview image)
  mesh_tolerance: 0.0005     # linear (mm); finer than export for smooth tube
  mesh_angular_tolerance: 0.04 # rad
  image_width: 800           # px
  image_height: 600         # px
  dpi: 100                   # dots per inch
  elevation: 30              # deg – 3D view elevation
  azimuth: 45                # deg – 3D view azimuth
  roll: 0                    # deg – 3D view roll
  light_azimuth: 225         # deg – light direction azimuth
  light_elevation: 45        # deg – light direction elevation
  color: '#b3b3b3'           # hex or name – model color; also base hue for per-part colors in --server viewer when the result is a multi-part assembly
  opacity: 1.0               # 0.0–1.0
  background: '#1a1a2e'      # hex or name – background color
