knot_type: k15n3

# =============================================================================
# BROKEN AS CONFIGURED: sweeps only at an unusable scale.
# =============================================================================
#
# Topology is checked by tests/test_knot_catalogue.py (pytest -m slow) and
# passes -- the curve really is K15n3. Only the sweep is unresolved.
#
# What is known:
#
#   200 x 110 x 200     (1x)   Standard_Failure: Bnd_Box is void      (~432 s)
#   1600 x 880 x 1600   (8x)   NEVER TESTED. That is the value below.
#   9600 x 5280 x 9600 (48x)   SWEEPS -- but the part is
#                              7504 x 9592 x 3040 mm, i.e. 9.5 METRES,
#                              with strands 313 mm apart              (~570 s)
#
# So a working setting exists, and it is useless. The smallest volume that
# actually sweeps is unknown: everything between 1x and 48x is untested, and
# each probe costs ~10 minutes, so bisect rather than guess.
#
# One counter-intuitive result worth knowing before you tune: at 48x this
# knot sweeps with 600 points and FAILS with 400
# (BRepOffsetAPI_MakePipeShell::MakeSolid). Fewer control points is not
# reliably easier for OCC, so do not reach for a lower NUM_POINTS as a fix --
# and below 400 the relaxed curve stops being K15n3 anyway.
#
# DIAGNOSIS. Measured on the scaled centerline at the default 1x bounds:
#
#   minimum radius of curvature   5.42 mm
#   tube outer radius            15.00 mm     <-- centerline bends 2.8x tighter
#   closest strand approach       5.56 mm
#   tube outer diameter          30.00 mm     <-- strands overlap by ~24 mm
#
# WHAT TO TRY:
#
#   1. Shrink face_settings.led_circle_tube.outer_diameter (30 mm today).
#      This is the only lever that makes a 15-crossing knot a printable
#      object. Bounds scale the part; tube diameter scales the requirement.
#      Halving the diameter roughly halves the volume needed.
#   2. If a large part is acceptable, bisect output_bounds between 8x and 48x
#      and pair the result with max_print_bounds segmentation.
#
# The bounds below are an 8x starting point for that search, NOT a verified
# value. Check the bounding box of whatever you get: at too-tight bounds this
# pipeline can return a sub-millimetre solid without raising an error.
#
# Do not edit this file while a bounds sweep against it is running -- the
# config is re-read per attempt and the multipliers compound silently.
#
# To reproduce: uv run render-knot knot_configs/k15n3.yaml
# =============================================================================
output_bounds:
  width: 1600   # mm  PLACEHOLDER -- not a verified value
  length: 880   # mm
