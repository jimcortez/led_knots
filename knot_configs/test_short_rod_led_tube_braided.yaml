knot_type: rod
name: test_short_rod_led_tube_braided
# -----------------------------------------------------------------------------
# Output bounds: bounding box for knot path scaling
# -----------------------------------------------------------------------------
output_bounds:
  width: 100    # mm
  length: 100   # mm
  height: 100   # mm

face_type: braided_rope_tube

face_settings:
  # Braided-rope sleeve along the path (Step 4).
  braided_rope_tube:
    braided_rope:
      num_strands_per_dir: 75
      braid_tightness: 1.0
      pack_factor: 0.9
      weave_amplitude_factor: 1.0
      # 150 strands is impractically slow to fuse as B-rep (OCC booleans scale
      # ~quadratically with the growing accumulator). The mesh path unions
      # watertight strand meshes via manifold: fast and memory-bounded. Output
      # is a watertight mesh (STL/GLB/preview), so STEP and SLA-optimize are
      # unavailable for this config; switch to fuse_method: brep if you need them
      # (at a lower strand count).
      fuse_method: mesh